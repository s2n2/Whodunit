<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Whodunit card preview</title>
<style>
 :root{--primary-color:#03a9f4;--primary-text-color:#212121;--secondary-text-color:#727272;--divider-color:#e0e0e0;--card-background-color:#fff;--secondary-background-color:#f0f2f5;--error-color:#db4437;--warning-color:#ffa600;--success-color:#43a047;--accent-color:#ff9800}
 body.dark{--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--divider-color:#3a3a3a;--card-background-color:#1c1c1c;--secondary-background-color:#2a2a2a}
 body{margin:0;padding:16px;background:var(--secondary-background-color);font-family:Roboto,system-ui,sans-serif;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
 ha-card{display:block;background:var(--card-background-color);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
 ha-icon{display:inline-flex;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px)}
 ha-icon svg{width:100%;height:100%;fill:currentColor}
</style>

customElements.define("ha-icon",class extends HTMLElement{static get observedAttributes(){return["icon"]}attributeChangedCallback(){const d=P[this.getAttribute("icon")]||"M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20";this.innerHTML=`<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`}});
customElements.define("ha-card",class extends HTMLElement{});

<script src="../custom_components/whodunit/frontend/whodunit-card.js"></script>
</head><body>
<script>
(async()=>{
 if(location.hash.includes("dark"))document.body.classList.add("dark");
 const fx=await (await fetch("fixture.json")).json();
 const subs=[];
 const hass={states:{"light.hallway":{attributes:{friendly_name:"Hallway Lights"}},"automation.motion_in_lounge_2":{attributes:{id:"1690000000",friendly_name:"Motion in Lounge"}},"switch.lounge_candles":{attributes:{friendly_name:"Lounge candles"}}},
  connection:{subscribeMessage:async(cb)=>{subs.push(cb);return()=>{}}},
  callWS:async(m)=>{const k=m.type.split("/")[1];if(k==="explain")return fx.explain[m.entity_id]||{entity_id:m.entity_id,changes:[],sentence:m.entity_id+" has not changed since Whodunit started.",tracked:true};return fx[k];}};
 const mk=(cfg)=>{const c=document.createElement("whodunit-card");c.setConfig(cfg);document.body.appendChild(c);c.hass=hass;return c};
 window.cards=[mk({}),mk({title:"Why are the candles off?",entity:"switch.lounge_candles"}),mk({default_tab:"fights"}),mk({default_tab:"busy"})];
 window.push=(d)=>subs.forEach(s=>s({kind:"change",data:d}));
})();
</script></body></html>
